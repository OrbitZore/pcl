name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # DESIGN §12：Python 3.10–3.14 × Linux/macOS
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: pclang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（含 dev 依赖）
        run: python -m pip install -e ".[dev]"
      - name: Lint（ruff）
        run: ruff check src tests
      - name: 测试（pytest）
        # smoke_pi 标记在无 pi 二进制的环境自动跳过；模糊测试默认 1500 轮
        run: python -m pytest -q

  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建
        run: python -m pip install build && python -m build
        working-directory: pclang
      - name: 干净环境安装冒烟
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install pclang/dist/*.whl
          /tmp/fresh/bin/pcl version
          /tmp/fresh/bin/pcl check tests/data/demo.pcl --cache none
        working-directory: pclang

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Version single-source & bilingual pairing
        run: |
          python3 - <<'PY'
          import json, re, sys
          v = re.search(r'__version__ = "(.+?)"',
                        open("pclang/src/pcl/_version.py").read()).group(1)
          pkg = json.load(open("pcl-connector/pi/package.json"))["version"]
          # PEP 440 与 npm semver 预发布分隔符不同：0.2.0a1 ↔ 0.2.0-a1
          pkg_as_pep = re.sub(r"^(\d+\.\d+\.\d+)-(.+)$", r"\1\2", pkg)
          assert v == pkg_as_pep, f"version drift: _version.py={v} package.json={pkg}"
          import glob, os
          zh = {os.path.basename(p) for p in glob.glob("docs/zh/*.md")}
          en = {os.path.basename(p) for p in glob.glob("docs/en/*.md")}
          assert zh == en, f"docs mismatch: zh-only={zh-en}, en-only={en-zh}"
          rfc = {p.rsplit("/", 1)[1] for p in glob.glob("rfc/rfc-0*.md")}
          for f in rfc:
              if not f.endswith(".zh.md"):
                  assert f"{f[:-3]}.zh.md" in rfc, f"RFC missing .zh edition: {f}"
          print(f"ok: version={v}, docs paired, rfcs paired")
          PY
