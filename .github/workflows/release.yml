name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # 手动补发/重试（无需移 tag）

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # PyPI Trusted Publishing（OIDC，零密钥）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pipx install uv || pip install uv
          cd pclang && uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pclang/dist/

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Publish pcl-connector-pi（未配置 NPM_TOKEN secret 时跳过）
        if: ${{ secrets.NPM_TOKEN != '' }}      # step 级可访问 secrets（job 级不可）
        run: |
          V=$(node -p "require('./package.json').version")
          if [[ "$V" == *-* ]]; then
            npm publish --access public --tag alpha   # 预发布 → alpha dist-tag
          else
            npm publish --access public               # stable → latest
          fi
        working-directory: pcl-connector/pi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
