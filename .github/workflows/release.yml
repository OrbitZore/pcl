name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # 手动补发/重试（无需移 tag）

jobs:
  pypi:
    if: github.event_name == 'push'   # 仅 tag 首触发时上传；dispatch 补发不重复
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # PyPI Trusted Publishing（OIDC，零密钥）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pipx install uv || pip install uv
          cd pclang && uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pclang/dist/

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # npm Trusted Publishing（OIDC，零密钥）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: npm Trusted Publishing 需较新 CLI
        run: npm install -g npm@latest
      - name: Publish pcl-connector-pi
        run: |
          V=$(node -p "require('./package.json').version")
          if [[ "$V" == *-* ]]; then
            npm publish --access public --tag alpha   # 预发布 → alpha dist-tag
          else
            npm publish --access public               # stable → latest
          fi
        working-directory: pcl-connector/pi
