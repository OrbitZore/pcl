name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # PyPI Trusted Publishing（OIDC，零密钥）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pipx install uv || pip install uv
          cd pclang && uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pclang/dist/

# npm 连接器（pcl-connector-pi）由维护者本地发布（npm login + 2FA）：
#   cd pcl-connector/pi && npm publish --access public
# 如需 CI 发布，追加 job 并在仓库 Secrets 配置 NPM_TOKEN。
