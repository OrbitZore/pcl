site_name: PCL — Prompt Control Language
site_description: A template DSL for orchestrating LLM agents — template layer is PCL, script layer is real Python.
site_url: https://OrbitZore.github.io/pcl/
repo_url: https://github.com/OrbitZore/pcl
repo_name: OrbitZore/pcl
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Language Reference: dsl.md
  - Architecture: design.md
  - Settings: settings.md
  - Examples: examples.md
  - Changelog: changelog.md
