site_name: PCL — Prompt Control Language
site_description: A template DSL for orchestrating LLM agents — template layer is PCL, script layer is real Python.
site_url: https://OrbitZore.github.io/pcl/
repo_url: https://github.com/OrbitZore/pcl
repo_name: OrbitZore/pcl
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:pymdownx.slugs._uslugify

nav:
  - Home: en/index.md
  - Quickstart: en/quickstart.md
  - Guide: en/guide.md
  - Language Reference: en/language.md
  - CLI Manual: en/cli.md
  - Settings: en/settings.md
  - Examples: en/examples.md
  - FAQ: en/faq.md
  - Changelog: en/changelog.md
