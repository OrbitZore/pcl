[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pclang"                     # PyPI 分发名（`pcl` 已被占位包占用）；import 名仍为 pcl
version = "0.1.0.dev0"
description = "PCL — Prompt Control Language：编排 LLM/agent 的模板 DSL（模板层是 PCL，脚本层是真 Python）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []                   # 运行时零第三方依赖
authors = [{ name = "pcl contributors" }]

[project.scripts]
pcl = "pcl.cli:main"
pclang = "pcl.cli:main"             # 别名：uvx/pipx 按可执行名匹配，使 `uvx pclang` 直接可用

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/golden"]   # 生成源快照，不参与 lint

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B027"]   # B027：桥接层可选生命周期钩子有意为空
